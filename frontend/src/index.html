<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Main Courante Police - Gabon 🇬🇦</title>
  <base href="/">
  
  <!-- Meta viewport pour responsive mobile/tablette -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- PWA Configuration -->
  <meta name="description" content="Système de gestion de main courante des forces de l'ordre du Gabon">
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  
  <!-- Preconnect pour optimisation -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Fonts Google -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <!-- CSS critiques inline pour mobile -->
  <style>
    /* Styles critiques pour éviter FOUC */
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #fafafa;
    }
    
    /* Loader initial */
    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1976d2, #42a5f5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
    }
    
    .loader-logo {
      font-size: 3rem;
      margin-bottom: 2rem;
      animation: pulse 2s infinite;
    }
    
    .loader-text {
      font-size: 1.2rem;
      font-weight: 300;
      margin-bottom: 2rem;
      text-align: center;
      padding: 0 1rem;
    }
    
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    /* Responsive breakpoints */
    @media (max-width: 768px) {
      .loader-logo {
        font-size: 2rem;
      }
      .loader-text {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Loader initial pendant chargement de l'app -->
    <div class="initial-loader">
      <div class="loader-logo">🚔</div>
      <div class="loader-text">
        Système de Gestion Main Courante<br>
        Forces de l'Ordre - Gabon
      </div>
      <div class="spinner"></div>
    </div>
  </app-root>
  
  <!-- Service Worker pour PWA -->
  <noscript>
    <div style="padding: 2rem; text-align: center; background: #f44336; color: white;">
      <h2>JavaScript requis</h2>
      <p>Veuillez activer JavaScript pour utiliser cette application.</p>
    </div>
  </noscript>
</body>
</html>
